<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIX Signup</title>
<style>
body {
    background: #202020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
.form-container {
    background: #272727;
    width: 350px;
    margin: 100px auto;
    padding: 20px;
    border-radius: 10px;
}
input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
}
.error-box {
    border: 1px solid red;
    color: red;
    padding: 5px;
    display: none;
}
</style>
</head>
<body>

<div class="form-container">
    <h2>A FEW KLIX TO PLAY!</h2>

    <form action="signup.php" method="POST" onsubmit="return validateForm()">
        <input type="text" id="username" name="username" placeholder="Username (3 to 15 characters long)" required>
        <div id="username-error" class="error-box"></div>

        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required>
        <div id="password-error" class="error-box"></div>

        <input type="submit" value="Sign Up">
    </form>
</div>

<script>
function validateForm() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirm-password").value;

    let usernameError = document.getElementById("username-error");
    let passwordError = document.getElementById("password-error");

    let valid = true;

    if (username.length < 3) {
        usernameError.textContent = "Too short";
        usernameError.style.display = "block";
        valid = false;
    } else if (username.length > 15) {
        usernameError.textContent = "Too long";
        usernameError.style.display = "block";
        valid = false;
    } else {
        usernameError.style.display = "none";
    }

    if (password !== confirmPassword) {
        passwordError.textContent = "Unmatching passwords";
        passwordError.style.display = "block";
        valid = false;
    } else {
        passwordError.style.display = "none";
    }

    return valid;
}
</script>

</body>
</html>
