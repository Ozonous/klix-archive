<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right, #ff7e5f, #feb47b);
            filter: blur(3px);
            z-index: -1;
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5));
            z-index: -1;
        }

        .content {
            z-index: 1;
            text-align: center;
            position: relative;
        }
    </style>
</head>
<body>
    <audio autoplay loop>
        <source src="xboxmusic.mp3" type="audio/mp3">
    </audio>

    <div class="background"></div>
    <div class="gradient-overlay"></div>

    <div class="content">
        <h1>KlixBlox</h1>
    </div>
</body>
</html>
